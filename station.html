<meta charset="utf-8" />
<title>Упаковочная станция — макет</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  .field { margin: 16px 0; }
  label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  input, select { font-size: 18px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
  .weight-display { font-size: 40px; font-weight: 600; }
  .weight-display.waiting { color: #aaa; font-weight: 400; font-size: 20px; }
  button { font-size: 16px; padding: 12px 16px; margin: 6px 6px 6px 0; cursor: pointer; }

  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    .print-section { display: none; }
    body.printing-label #printLabel { display: block; }
    body.printing-declaration #printDeclaration { display: block; }
    /* размер под ленту Brother DK — поменяй width под фактический ролик, если он другой */
    #printLabel { width: 62mm; padding: 4mm; text-align: center; }
    #printLabel svg { width: 100%; height: auto; }
    .decl-doc { width: 190mm; padding: 10mm; font-size: 12pt; line-height: 1.6; }
  }
</style>

<h1>Упаковочная станция (макет)</h1>

<div class="field">
  <label>Тип коробки</label>
  <select id="boxType">
    <option value="0.2">Маленькая (тара 0.2 кг)</option>
    <option value="0.35">Средняя (тара 0.35 кг)</option>
    <option value="0.6">Большая (тара 0.6 кг)</option>
  </select>
</div>

<div class="field">
  <label>Вес с весов (нетто)</label>
  <div id="weight" class="weight-display waiting">ждём вес с телефона...</div>
</div>

<div class="field">
  <label>Вес брутто (нетто + тара коробки) — то, что уходит в форму на сайте</label>
  <input id="grossWeight" readonly value="—" />
</div>

<div class="field">
  <button onclick="printBarcode()">Печать штрихкода</button>
  <button onclick="printDeclaration()">Печать декларации</button>
</div>

<div id="printArea">
  <div id="printLabel" class="print-section">
    <svg id="printBarcodeSvg"></svg>
  </div>
  <div id="printDeclaration" class="print-section"></div>
</div>

<script>
  let netWeight = null;

  const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === "weight") {
      netWeight = data.value;
      const el = document.getElementById("weight");
      el.textContent = netWeight.toFixed(2) + " кг";
      el.classList.remove("waiting");
      updateGross();
    }
  };

  document.getElementById("boxType").addEventListener("change", updateGross);

  function updateGross() {
    if (netWeight === null) return;
    const tare = parseFloat(document.getElementById("boxType").value);
    document.getElementById("grossWeight").value = (netWeight + tare).toFixed(2) + " кг";
  }

  const BRIDGE_URL = "http://127.0.0.1:7777";

  async function bridgePrint(target) {
    try {
      const res = await fetch(`${BRIDGE_URL}/print?target=${target}`, {
        method: "POST",
        signal: AbortSignal.timeout(5000),
      });
      if (!res.ok) console.warn("print-bridge вернул ошибку:", await res.text());
      return res.ok;
    } catch (e) {
      return false;
    }
  }

  function printPdfFile(url) {
    return new Promise((resolve) => {
      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.onload = () => {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
        } catch (e) {
          console.warn("не удалось напечатать PDF в iframe", e);
        }
        setTimeout(() => {
          iframe.remove();
          resolve();
        }, 1000);
      };
      iframe.src = url;
      document.body.appendChild(iframe);
    });
  }

  async function printRealPdf(target) {
    const fileName = target === "declaration" ? "declaration.pdf" : "label.pdf";
    const url = `/assets/${fileName}`;
    try {
      const head = await fetch(url, { method: "HEAD" });
      if (!head.ok) return false;
      await printPdfFile(url);
      return true;
    } catch (e) {
      console.warn("не удалось проверить/напечатать PDF", e);
      return false;
    }
  }

  function printLabel(code) {
    return new Promise(async (resolve) => {
      if (await bridgePrint("label")) return resolve();
      if (await printRealPdf("label")) return resolve();
      const svg = document.getElementById("printBarcodeSvg");
      svg.innerHTML = "";
      JsBarcode(svg, code, { height: 60, fontSize: 14 });
      document.body.classList.add("printing-label");
      window.addEventListener("afterprint", function handler() {
        document.body.classList.remove("printing-label");
        window.removeEventListener("afterprint", handler);
        resolve();
      });
      setTimeout(() => window.print(), 100);
    });
  }

  function printDeclarationDoc(netW, gross) {
    return new Promise(async (resolve) => {
      if (await bridgePrint("declaration")) return resolve();
      if (await printRealPdf("declaration")) return resolve();
      document.getElementById("printDeclaration").innerHTML = `
        <div class="decl-doc">
          <h2>Декларация</h2>
          <p>Дата: ${new Date().toLocaleDateString()}</p>
          <p>Вес нетто: ${netW.toFixed(2)} кг</p>
          <p>Вес брутто: ${gross}</p>
          <p>Хрупкое: да</p>
        </div>
      `;
      document.body.classList.add("printing-declaration");
      window.addEventListener("afterprint", function handler() {
        document.body.classList.remove("printing-declaration");
        window.removeEventListener("afterprint", handler);
        resolve();
      });
      setTimeout(() => window.print(), 100);
    });
  }

  async function printBarcode() {
    if (netWeight === null) { alert("Сначала получи вес с телефона"); return; }
    const code = "BY" + Date.now().toString().slice(-9);
    await printLabel(code);
  }

  async function printDeclaration() {
    if (netWeight === null) { alert("Сначала получи вес с телефона"); return; }
    const gross = document.getElementById("grossWeight").value;
    await printDeclarationDoc(netWeight, gross);
  }
</script>
